name: Check persona framework

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.github/personas/**'
      - '.github/workflows/check-personas.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '.github/personas/**'
      - '.github/workflows/check-personas.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate declarations and reject invalid configurations
        run: python3 .github/personas/check.py --self-test
