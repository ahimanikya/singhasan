    <h2>Power passes.<br>The earth remembers.</h2>
    <div class="back-cover-blurb"><p>A throne lies beneath an ordinary patch of earth. Above it, cattle graze, children gather, and life goes on.</p><p>Across sixty-eight poems, myth and history meet the ceremonies of power and the lives of ordinary people. The journey returns to the earth, where an old story may begin again.</p></div>
    <div class="back-cover-author"><img src="assets/writers/41-earth-voice-v1.png" width="1086" height="1448" alt="Portrait of Pravakar Satapathy"><div><h3 lang="or">ପ୍ରଭାକର ଶତପଥୀ</h3><p>Pravakar Satapathy is an Odia poet and editor associated with Jajpur. His writing spans poetry and the literary culture of little magazines.</p></div></div>
